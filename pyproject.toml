[project]
name = "agent-bench-lab"
version = "0.1.0"
description = "Runner for benchmarking coding-agent setups: token accounting + deterministic grading"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Only needed when grading the swebench family; the harness pulls Docker + datasets.
swebench = [
    "swebench>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
abl = "runner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["runner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
