# request bills at the long rates below. Codex usage is reported per run (sum
# of turns), so v0 applies the tier on per-run input as an approximation —
# ceiling: per-REQUEST tiering needs per-request usage, revisit before analysis.
long_context_threshold_tokens = 272000
