# Study #1 — token-saving tools. Runner configuration (v0).
# All relative paths resolve against the repo root.

paths:
  workspaces: sandbox/workspaces
  data: studies/token-saving-tools/data
  prices: config/prices.toml

agents:
  claude:
    binary: claude
    model: claude-opus-5            # pinned: the default inherits the user's [1m] variant
    model_flag: --model
    config_dir: sandbox/claude-config   # + the arm's suffix; never ~/.claude
    extra_args: ["--permission-mode", "bypassPermissions"]
    env: {}
  codex:
    binary: codex
    model: gpt-5.6-sol              # CONFIRMED 2026-07-30: accepted by codex exec -m in live runs
    model_flag: -m
    config_dir: sandbox/codex-home      # + the arm's suffix; never ~/.codex
    # --full-auto: workspace-write OS sandbox + no approval prompts. codex exec's
    # default sandbox is read-only, which silently kills ANSWER.txt writes.
    extra_args: ["--full-auto"]
    env: {}

# Each arm = one sterile config dir with exactly one tool installed.
# Config dirs for treatment arms may not exist yet; the runner discards the run with a
# clear "missing_config_dir" message instead of falling back to a personal config.
arms:
  baseline: {}                      # sterile config, no suffix, no tool
  caveman:
    config_dir_suffix: "-caveman"
    # Codex install is project-local (npx skills add): the runner seeds each fresh
    # workspace from workspace_seed. Runner support lands with 3.0 arm plumbing.
    workspace_seed:
      codex: sandbox/workspace-seed-caveman-codex
    activation_signatures:
      claude:
        - "CAVEMAN MODE ACTIVE"     # verified live 2026-07-30 (SessionStart hook)
      codex:
        # Explicit skill invocation; catalog listing alone is availability, not use.
        # Ceiling: agent-initiated silent skill use is missed — refine in 3.0.
        - "$caveman"
  ponytail:
    config_dir_suffix: "-ponytail"
    workspace_seed:
      codex: sandbox/workspace-seed-ponytail-codex
    activation_signatures:
      claude:
        - "Ponytail governs what you build"   # verified live 2026-07-30
      codex:
        - "$ponytail"               # same ceiling as caveman
  rtk:
    config_dir_suffix: "-rtk"
    # rtk has NO Codex CLI support (not in its --agent list, v0.44.1) — Claude-only arm.
    activation_signatures:
      claude:
        - "rtk hook claude"         # verified live 2026-07-30: PreToolUse hook execution record
      codex: []                     # arm does not exist on codex
  headroom:
    config_dir_suffix: "-headroom"
    # Headroom proxies the agent: the driver runs `headroom wrap <agent> -- <args>`.
    wrap: headroom
    extra_agent_args:
      # VERIFIED 2026-07-30: without this key codex retries ws:// 5x (403) before HTTPS
      # fallback; with it, zero fallback noise.
      codex: ["-c", "features.responses_websocket=false"]
      claude: []
    activation_signatures:
      claude:
        - "\"headroom\""            # verified 2026-07-30: registers as MCP server (quoted = exact JSON string, not config-path substrings)
      codex:
        - "127.0.0.1:8787"          # verified 2026-07-30: headroom proxy endpoint in transport logs

# Mechanism flags counted per run: lines of the log (claude session JSONL / codex stdout)
# containing any of the substrings below. A flag with an empty list always reports 0.
log_flags:
  compaction:
    claude: ["isCompactSummary", "compact_boundary"]   # TODO verify live
    codex: []
  rate_limited:
    claude: ["rate_limit", "overloaded_error"]
    codex: ["rate limit", "Reconnecting"]
  ws_fallback:
    claude: []
    codex: ["Falling back from WebSockets"]   # verified live 2026-07-30 (forced 403 trigger)

# Reasoning effort → CLI args / env, per agent. Both levels are empty placeholders:
# MAX_THINKING_TOKENS is NOT the mechanism.
efforts:
  medium:
    claude:
      args: ["--effort", "medium"]        # verified: claude --effort <level>
      env: {}
    codex:
      args: ["-c", "model_reasoning_effort=\"medium\""]   # verified live 2026-07-30
      env: {}
  xhigh:
    claude:
      args: ["--effort", "xhigh"]
      env: {}
    codex:
      args: ["-c", "model_reasoning_effort=\"xhigh\""]    # verified live 2026-07-30
      env: {}

families:
  comprehension:
    tasks: studies/token-saving-tools/tasks/comprehension.json
  dsbench:
    tasks: studies/token-saving-tools/tasks/dsbench.json
  swebench:
    tasks: studies/token-saving-tools/tasks/swebench.json

timeouts:
  agent_run_s: 1800
  git_s: 900
  grading_s: 3600

# `abl campaign` — step-3 batch scheduler for the main experiment.
# Added after the pre-registration freeze as a visible change (freeze.md allows this with
# a stated reason): it encodes the run order already registered in docs/run-order.md and
# amendment A1, and changes no part of the design — no arm, task, effort or replication
# count here differs from what the frozen documents state.
campaign:
  phase: main
  # Tier order (rule 1): every medium-effort run before any xhigh run.
  efforts: [medium, xhigh]
  # Slice order inside a tier (rule 2): the Claude slice is checkpoint 1a.
  agents: [claude, codex]
  # Amendment A1: rtk is withdrawn and is NOT scheduled; its arm block above is kept only
  # as the record of the exclusion basis.
  arms: [baseline, caveman, ponytail, headroom]
  # Family order inside a slice; tasks keep their manifest order.
  families: [comprehension, dsbench, swebench]
  # Replication, amendment A2 (2026-07-30, pre-data, docs/run-order.md): uniform k=2 on
  # every cell, both agents. Yields 2 agents x 4 arms x 2 tiers x 34 tasks x k=2 = 1,088 runs.
  reps:
    claude:
      default: 2
    codex:
      default: 2
  # Tasks already spent on the step-0 gate and the step-1 warm-up. Excluding them leaves
  # the 34 fresh main-study tasks (10 comprehension / 12 DSBench / 12 SWE-bench) that
  # freeze.md registers, without editing the frozen manifests.
  exclude_tasks:
    comprehension: [q01, q02, q04, q05, q09]
    dsbench:
      - "00000001-q17"
      - "00000005-q28"
      - "00000010-q13"
      - "00000019-q14"
    swebench:
      - pallets__flask-5014
      - psf__requests-1766
      - django__django-11141
      - scikit-learn__scikit-learn-10844
      - sympy__sympy-12096

# `abl gate` — step-0 exit gate: first task of each family × these agents.
gate:
  agents:
    - claude
    - codex
  arm: baseline
  effort: medium
